seed: 42

database:
  host: localhost
  port: 5434
  name: public_transport
  user: postgres
  password: postgres_dev

generation:
  stops: 150
  lines: 40
  trips: 3000
  drivers: 1100
  vehicles: 580
  # first service day; executions cover days_of_executions days from here
  start_date: 2024-01-01
  # every trip runs on every day its calendar is in service (full timetable)
  days_of_executions: 730
  connections_per_trip:
    min: 6
    max: 18
  # delete existing data before seeding
  truncate_existing: true


realism:
  geography:
    center_lat: 35.3748
    center_lon: -120.8468
    radius_km: 16

  # Fractions of trips that are tram, express, on-request, screen, and low-floor vehicles.
  tram_fraction: 0.30
  express_fraction: 0.12
  on_request_fraction: 0.10
  screen_fraction: 0.35
  low_floor_fraction: 0.85

  departures:
    # weighting of departures by hour of the day (0-23) for weekdays and weekends
    weekday_weights: [1, 1, 1, 1, 3, 8, 18, 30, 30, 18, 15, 15, 16, 18, 22, 30, 30, 25, 20, 14, 10, 7, 5, 3]
    weekend_weights: [2, 2, 1, 1, 2, 4, 7, 10, 12, 15, 18, 20, 22, 22, 22, 22, 22, 20, 18, 16, 12, 9, 6, 4]
    rush_hour_multiplier: 1.5
    night_traffic_multiplier: 0.3

  connections:
    average_speed_kmh: 23 
    travel_minutes:
      min: 2
      max: 9
    dwell_seconds: 30

  delays:
    on_time_probability: 0.70
    average_delay_minutes: 4
    max_delay_minutes: 30

  enforce_resource_conflicts: true

  # weekday public holidays (Poland) run the weekend schedule, stored as calendar_dates exceptions
  public_holidays: true
  # fraction of trips left without any executions (planned only, e.g. new services)
  unexecuted_trip_fraction: 0.02

  # driver shifts: minutes between trips, daily driving limit, shift span (first start to last end),
  # daily rest, days off in a 7-day rota
  layover_minutes: 5
  max_driver_minutes_per_day: 540
  max_shift_span_minutes: 720
  driver_daily_rest_minutes: 660
  driver_days_off_per_week: 2

  # vehicle downtime: a one-day inspection every N days, plus random multi-day repairs
  # (0 to 2x vehicle_repairs_per_year per vehicle and year)
  vehicle_inspection_interval_days: 30
  vehicle_repairs_per_year: 2
  vehicle_repair_days:
    min: 2
    max: 10

  # driver absences per year, in calendar days: a summer holiday (June-August),
  # other leave blocks at random dates, and sick leave (0 to 2x the value, in 1-5 day spells)
  driver_summer_leave_days: 14
  driver_other_leave_blocks: [7, 5]
  driver_sick_days_per_year: 8

performance:
  batch_size: 50000
  use_copy: true
